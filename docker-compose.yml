services:

  # ── MongoDB (Game data) ───────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    platform: linux/amd64  # <--- Añade esto
    container_name: blackjack_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: blackjack
    volumes:
      - mongo_data:/data/db

  # ── MySQL (Player data) ───────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    platform: linux/amd64  # <--- También recomendado para estabilidad en Mac
    container_name: blackjack_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: blackjack
      MYSQL_USER: blackjack
      MYSQL_PASSWORD: blackjack
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ublackjack", "-pblackjack"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Blackjack API ─────────────────────────────────────────────────────────────
  app:
    build: .                          # construye la imagen desde el Dockerfile local
    container_name: blackjack_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Sobreescribimos las URLs para usar los nombres de servicio de Docker
      # en lugar de 'localhost' (que dentro del contenedor apuntaría a sí mismo)
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/blackjack
      SPRING_R2DBC_URL: r2dbc:mysql://mysql:3306/blackjack
      SPRING_R2DBC_USERNAME: blackjack
      SPRING_R2DBC_PASSWORD: blackjack
    depends_on:
      mysql:
        condition: service_healthy   # espera a que MySQL esté listo antes de arrancar
      mongodb:
        condition: service_started

volumes:
  mongo_data:
  mysql_data:
